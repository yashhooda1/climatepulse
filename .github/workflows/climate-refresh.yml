name: ClimatePulse — daily data refresh

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 3 1 * *'      # 1st of month — full rebuild
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Ignore cache and refetch 1970–present'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout climatepulse repo
        uses: actions/checkout@v4

      - name: Inspect cache state
        run: |
          echo "--- tracked cache files at checkout ---"
          git ls-files cache | head -20
          echo "count: $(git ls-files cache | wc -l)"
          echo "--- gitignore check ---"
          git check-ignore -v cache/ || echo "cache/ not ignored"
          echo "--- on-disk ---"
          ls -la cache/ 2>/dev/null || echo "cache/ does not exist"

      - name: Mark run start
        run: touch /tmp/run-start

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests pyarrow

      - name: Run pipeline
        env:
          NOAA_TOKEN:   ${{ secrets.NOAA_TOKEN }}
          FULL_REFRESH: ${{ (github.event.schedule == '0 3 1 * *' || inputs.full_refresh == true) && '1' || '0' }}
        run: python scripts/climate_pipeline.py

      - name: Build hurricane analytics
        id: hurricane
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            python scripts/hurricane_pipeline.py && exit 0
            echo "attempt $i failed; sleeping $((i*15))s"
            sleep $((i*15))
          done
          exit 1

      - name: Build sea level analytics
        id: sealevel
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            python scripts/sealevel_pipeline.py && exit 0
            echo "attempt $i failed; sleeping $((i*15))s"
            sleep $((i*15))
          done
          exit 1

      - name: Build U.S. grid feed (EIA)
        id: eia
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          for i in 1 2 3; do
            python scripts/eia_grid_pipeline.py && exit 0
            echo "attempt $i failed; sleeping $((i*15))s"
            sleep $((i*15))
          done
          exit 1

      - name: Gate on analytics outcomes
        run: |
          FAILED=""
          if [ "${{ steps.hurricane.outcome }}" = "failure" ]; then FAILED="$FAILED hurricane"; fi
          if [ "${{ steps.sealevel.outcome }}"  = "failure" ]; then FAILED="$FAILED sealevel"; fi
          if [ "${{ steps.eia.outcome }}"       = "failure" ]; then FAILED="$FAILED eia"; fi

          if [ -n "$FAILED" ]; then
            echo "::warning title=Stale feeds::not regenerated:$FAILED"
            echo "### ⚠ Stale feeds:$FAILED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "all analytics feeds regenerated"
          fi

          # hard-fail only when every downstream feed died
          if [ "$FAILED" = " hurricane sealevel eia" ]; then
            echo "::error::all analytics feeds failed"
            exit 1
          fi

      - name: Validate output exists and is valid JSON
        run: |
          python3 -c "
          import json
          d = json.load(open('public_data_climate_gold.json'))
          assert len(d['station_codes']) == 13, 'station count regression'
          assert len(d['IAH']['yearly']) > 50 and len(d['EWR']['yearly']) > 50, 'core series truncated'
          thin = {c: len(d[c]['yearly']) for c in d['station_codes'] if len(d[c]['yearly']) < 25}
          assert not thin, f'short series: {thin}'
          print('✅ data_through', d['data_through'], '| stale:', d['stale_stations'] or 'none')
          "

      - name: Commit cache + gold back to climatepulse
        run: |
          mkdir -p cache
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A cache public_data_climate_gold.json
          echo "--- staged ---"; git diff --staged --stat
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: refresh climate cache [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Push updated gold data to yashhooda repo
        env:
          PAT: ${{ secrets.YASHHOODA_PAT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/yashhooda1/yashhooda.git site-repo
          FILES="public_data_climate_gold.json public_data_hurricanes_gold.json public_data_sealevel_gold.json public_data_us_grid_gold.json"
          COPIED=""
          for f in $FILES; do
            if [ -s "$f" ] && [ "$f" -nt /tmp/run-start ]; then
              cp "$f" "site-repo/$f"; COPIED="$COPIED $f"; echo "staged: $f"
            else
              echo "SKIP (not regenerated this run): $f"
            fi
          done
          if [ -z "$COPIED" ]; then
            echo "no gold files produced — nothing to push"
            exit 0
          fi
          cd site-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $COPIED
          git diff --staged --quiet \
            || git commit -m "chore: refresh ClimatePulse gold data [skip ci]"
          git push
