name: ClimatePulse — daily data refresh

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 3 1 * *'      # 1st of month — full rebuild
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Ignore cache and refetch 1970–present'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout climatepulse repo
        uses: actions/checkout@v4

      - name: Mark run start
        run: touch /tmp/run-start

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests pyarrow

      - name: Run pipeline
        env:
          NOAA_TOKEN:   ${{ secrets.NOAA_TOKEN }}
          FULL_REFRESH: ${{ github.event.schedule == '0 3 1 * *' || inputs.full_refresh }}
        run: python scripts/climate_pipeline.py

      - name: Build hurricane analytics
        continue-on-error: true
        run: python scripts/hurricane_pipeline.py

      - name: Build sea level analytics
        continue-on-error: true
        run: python scripts/sealevel_pipeline.py

      - name: Build U.S. grid feed (EIA)
        continue-on-error: true
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/eia_grid_pipeline.py

      - name: Validate output exists and is valid JSON
        run: |
          python3 -c "
          import json
          d = json.load(open('public_data_climate_gold.json'))
          assert len(d['station_codes']) == 13, 'station count regression'
          assert len(d['IAH']['yearly']) > 50 and len(d['EWR']['yearly']) > 50, 'core series truncated'
          thin = {c: len(d[c]['yearly']) for c in d['station_codes'] if len(d[c]['yearly']) < 25}
          assert not thin, f'short series: {thin}'
          print('✅ data_through', d['data_through'], '| stale:', d['stale_stations'] or 'none')
          "

      - name: Commit cache + gold back to climatepulse
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A cache public_data_climate_gold.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: refresh climate cache [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Push updated gold data to yashhooda repo
        env:
          PAT: ${{ secrets.YASHHOODA_PAT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/yashhooda1/yashhooda.git site-repo
          FILES="public_data_climate_gold.json public_data_hurricanes_gold.json public_data_sealevel_gold.json public_data_us_grid_gold.json"
          COPIED=""
          for f in $FILES; do
            if [ -s "$f" ] && [ "$f" -nt /tmp/run-start ]; then
              cp "$f" "site-repo/$f"; COPIED="$COPIED $f"; echo "staged: $f"
            else
              echo "SKIP (not regenerated this run): $f"
            fi
          done
          if [ -z "$COPIED" ]; then
            echo "no gold files produced — nothing to push"
            exit 0
          fi
          cd site-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $COPIED
          git diff --staged --quiet \
            || git commit -m "chore: refresh ClimatePulse gold data [skip ci]"
          git push
