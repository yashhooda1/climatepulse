name: TEMP — Austin real-data check (throwaway branch, no site push)

on:
  push:
    branches: [austin-real-data-check]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "pandas>=2.2,<3" "numpy>=1.26,<3" "pyarrow>=17,<26" "requests>=2.32,<3"
      - name: Run climate pipeline (real NOAA data)
        env:
          NOAA_TOKEN: ${{ secrets.NOAA_TOKEN }}
          FULL_REFRESH: 'true'
        run: python scripts/climate_pipeline.py
      - name: Commit real output to this throwaway branch only
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public_data_climate_gold.json cache
          git commit -m "chore: real-data check output [skip ci]" || echo "nothing to commit"
          git push origin HEAD:austin-real-data-check
